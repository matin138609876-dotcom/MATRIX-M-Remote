name: MATRIX M Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/matrix-m-release.jks
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Build signed Release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: matrixm
          KEYSTORE_PATH: ${{ runner.temp }}/matrix-m-release.jks
        run: gradle assembleRelease :companion:assembleRelease --no-daemon

      - name: Upload Controller APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-M-Controller-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Companion APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-M-Companion-Release
          path: companion/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/matrix-m-release.jks
        run: rm -f "$KEYSTORE_PATH"
