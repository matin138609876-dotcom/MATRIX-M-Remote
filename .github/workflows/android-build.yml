name: MATRIX M Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build both APKs
        run: gradle assembleDebug :companion:assembleDebug --no-daemon

      - name: Upload Controller APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-M-Controller
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Companion APK
        uses: actions/upload-artifact@v4
        with:
          name: MATRIX-M-Companion
          path: companion/build/outputs/apk/debug/*.apk
          if-no-files-found: error
